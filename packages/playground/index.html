<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ћ-скрипт Игралиште</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <h1>ћ-скрипт Игралиште</h1>
        <div id="header-controls">
          <select id="example-select">
            <option value="" disabled selected>Учитај пример...</option>
            <option value="здраво-свете">Здраво свете</option>
            <option value="класе">Класе</option>
            <option value="асинхроно">Асинхроно</option>
            <option value="низови">Низови</option>
            <option value="грешке">Грешке</option>
          </select>
          <button id="run-btn">&#9654; Покрени</button>
        </div>
      </header>
      <div id="editors">
        <div id="editor-source" class="editor-pane">
          <div class="pane-label">ћ-скрипт</div>
          <div id="monaco-source" class="monaco-container"></div>
        </div>
        <div id="editor-output" class="editor-pane">
          <div class="pane-label">JavaScript</div>
          <div id="monaco-output" class="monaco-container"></div>
        </div>
      </div>
      <div id="console-panel">
        <div class="pane-label">Конзола</div>
        <div id="console-output"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
